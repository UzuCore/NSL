[package]
name = "nsl"
version = "2.0.1"
edition = "2021"

[dependencies]
aes = "0.8"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "ico"] }
md5 = "0.7"
rayon = "1"
regex = "1"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
shlex = "1.3"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
ureq = { version = "2.12", features = ["json"] }
url = "2.5"
wait-timeout = "0.2"
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
futures = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
