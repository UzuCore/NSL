[package]
name = "nsrp-core"
version = "1.1.0"
edition = "2024"
rust-version = "1.92"
description = "MIT-licensed NSRP native package engine, vendored for NSL"
license = "MIT"

[dependencies]
anyhow = "1"
aes = "0.9.2"
byteorder = "1"
cipher = "0.5.2"
ctr = "0.10.1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
num_cpus = "1"
rayon = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
xts-mode = "0.6"
zstd = { version = "0.13", features = ["zstdmt"] }
zip = { version = "8.3", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32", "Win32_Foundation", "Win32_Storage_FileSystem"] }
